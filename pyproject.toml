[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arbor-harness"
version = "0.2.0"
description = "A lightweight, extensible runtime for coding agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "filelock>=3.16,<4",
  "prompt-toolkit>=3.0.48,<4",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
arbor = "arbor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.14", "types-jsonschema>=4.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/arbor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --basetemp=.work/pytest"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
# Bounded local file operations complete atomically before observing cancellation.
ignore = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
files = ["src/arbor"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
